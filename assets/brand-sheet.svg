    <circle class="numCircle" cx="44" cy="35" r="25"/><text class="num" x="44" y="48" text-anchor="middle">4</text><text class="cardTitle" x="88" y="45">Instagramの見せ方</text>
    <rect class="icon" x="58" y="92" width="46" height="76" rx="6"/><line class="icon" x1="75" y1="103" x2="87" y2="103"/><circle cx="81" cy="158" r="3" fill="#111"/>
    <line class="rule" x1="48" y1="185" x2="340" y2="185"/>
    <text class="body" x="58" y="222">・プロフィール文</text><text class="body" x="58" y="250">・投稿テーマ</text><text class="body" x="58" y="278">・ハイライト案</text>
  </g>

  <g transform="translate(552 620)">
    <rect class="card" width="390" height="270" rx="16"/><rect class="cardHead" width="390" height="70" rx="16"/>
    <circle class="numCircle" cx="44" cy="35" r="25"/><text class="num" x="44" y="48" text-anchor="middle">5</text><text class="cardTitle" x="88" y="45">LP・商品ページ</text>
    <rect class="icon" x="58" y="94" width="58" height="38"/><line class="icon" x1="87" y1="132" x2="87" y2="155"/><line class="icon" x1="71" y1="155" x2="103" y2="155"/>
    <line class="rule" x1="48" y1="185" x2="340" y2="185"/>
    <g transform="translate(58 205)"><circle class="numCircle" cx="13" cy="13" r="13"/><text class="miniNum" x="13" y="20" text-anchor="middle">1</text><text class="body" x="48" y="21">共感・導入</text><circle class="numCircle" cx="13" cy="43" r="13"/><text class="miniNum" x="13" y="50" text-anchor="middle">2</text><text class="body" x="48" y="51">魅力・価値</text><circle class="numCircle" cx="13" cy="73" r="13"/><text class="miniNum" x="13" y="80" text-anchor="middle">3</text><text class="body" x="48" y="81">具体的な内容</text><circle class="numCircle" cx="13" cy="103" r="13"/><text class="miniNum" x="13" y="110" text-anchor="middle">4</text><text class="body" x="48" y="111">相談・購入まで</text></g>
  </g>

  <g transform="translate(1014 620)">
    <rect class="card" width="390" height="270" rx="16"/><rect class="cardHead" width="390" height="70" rx="16"/>
    <circle class="numCircle" cx="44" cy="35" r="25"/><text class="num" x="44" y="48" text-anchor="middle">6</text><text class="cardTitle" x="88" y="45">次にやること</text>
    <path class="icon" d="M58 166V91M58 96c42-24 76 25 118 0v60c-42 25-76-24-118 0"/>
    <line class="rule" x1="48" y1="185" x2="340" y2="185"/>
    <text class="body" x="58" y="222">・今すぐ整えること</text><text class="body" x="58" y="250">・次に作るもの</text><text class="body" x="58" y="278">・優先順位</text>
  </g>

  <g transform="translate(552 980)"><path class="doc" d="M0-30h29l17 17v54H0zM29-30v17h17M10 6h22M10 20h26"/><text class="footer" x="64" y="13">納品形式：PDF / 6ページ</text></g>
