<svg xmlns="http://www.w3.org/2000/svg" width="1493" height="1053" viewBox="0 0 1493 1053" role="img" aria-labelledby="title desc">
  <title id="title">納品物イメージ ブランド整理PDF</title>
  <desc id="desc">ブランド整理PDF全6枚の納品イメージ。売り出す前に整理する項目を、文字中心のカードで示しています。</desc>
  <defs>
    <style>
      .bg{fill:#fff}
      .frame{fill:none;stroke:#d9d2ca;stroke-width:2}
      .title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:78px;font-weight:700;letter-spacing:.14em;fill:#151515}
      .subtitle{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:38px;font-weight:700;letter-spacing:.09em;fill:#a97a43}
      .lead{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:24px;font-weight:700;letter-spacing:.04em;fill:#181512}
      .card{fill:#fffefa;stroke:#dfd3c6;stroke-width:1.5}
      .cardHead{fill:#f6eee5}
      .numCircle{fill:#c99b6c}
      .num{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:27px;font-weight:800;fill:#fff;dominant-baseline:central;alignment-baseline:central}
      .cardTitle{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:25px;font-weight:800;letter-spacing:0;fill:#151515}
      .label{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:20px;font-weight:700;letter-spacing:0;fill:#191919}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:17px;font-weight:600;letter-spacing:0;fill:#5d554d}
      .rule{stroke:#caa178;stroke-width:1.6}
      .footer{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:27px;font-weight:800;letter-spacing:.02em;fill:#171717}
    </style>
  </defs>

  <rect class="bg" width="1493" height="1053"/>
  <rect class="frame" x="1" y="1" width="1491" height="1051"/>

  <text class="title" x="746.5" y="124" text-anchor="middle">納品物イメージ</text>
  <text class="subtitle" x="746.5" y="194" text-anchor="middle">ブランド整理PDF（全6枚）</text>
  <line class="rule" x1="720" y1="232" x2="773" y2="232"/>
  <text class="lead" x="746.5" y="278" text-anchor="middle">売り出す前に、言葉・見せ方・見てもらう順番を整理します。</text>

  <g transform="translate(105 340)">
    <rect class="card" width="385" height="235" rx="16"/>
    <rect class="cardHead" width="385" height="68" rx="16"/>
    <circle class="numCircle" cx="44" cy="34" r="25"/>
    <text class="num" x="44" y="34" text-anchor="middle">1</text>
    <text class="cardTitle" x="88" y="43">現状整理シート</text>
    <line class="rule" x1="48" y1="105" x2="337" y2="105"/>
    <text class="label" x="58" y="145">今ある情報を整理</text>
    <text class="sub" x="58" y="180">商品・サービス、悩み、</text>
    <text class="sub" x="58" y="207">ブランドの印象をまとめます。</text>
  </g>

  <g transform="translate(554 340)">
    <rect class="card" width="385" height="235" rx="16"/>
    <rect class="cardHead" width="385" height="68" rx="16"/>
    <circle class="numCircle" cx="44" cy="34" r="25"/>
    <text class="num" x="44" y="34" text-anchor="middle">2</text>
    <text class="cardTitle" x="88" y="43">届ける相手の整理</text>
    <line class="rule" x1="48" y1="105" x2="337" y2="105"/>
    <text class="label" x="58" y="145">誰に届けるかを明確に</text>
    <text class="sub" x="58" y="180">届けたい相手と、</text>
    <text class="sub" x="58" y="207">相手の悩みを整理します。</text>
  </g>

  <g transform="translate(1003 340)">
    <rect class="card" width="385" height="235" rx="16"/>
    <rect class="cardHead" width="385" height="68" rx="16"/>
    <circle class="numCircle" cx="44" cy="34" r="25"/>
    <text class="num" x="44" y="34" text-anchor="middle">3</text>
    <text class="cardTitle" x="88" y="43">魅力と言葉の整理</text>
    <line class="rule" x1="48" y1="105" x2="337" y2="105"/>
    <text class="label" x="58" y="145">選ばれる理由を言葉に</text>
    <text class="sub" x="58" y="180">魅力、価値、説明文の</text>
    <text class="sub" x="58" y="207">方向性を整理します。</text>
  </g>

  <g transform="translate(105 625)">
    <rect class="card" width="385" height="235" rx="16"/>
    <rect class="cardHead" width="385" height="68" rx="16"/>
    <circle class="numCircle" cx="44" cy="34" r="25"/>
    <text class="num" x="44" y="34" text-anchor="middle">4</text>
    <text class="cardTitle" x="88" y="43">Instagramの見せ方</text>
    <line class="rule" x1="48" y1="105" x2="337" y2="105"/>
    <text class="label" x="58" y="145">発信の土台を整理</text>
    <text class="sub" x="58" y="180">プロフィール文、投稿テーマ、</text>
    <text class="sub" x="58" y="207">ハイライト案をまとめます。</text>
  </g>

  <g transform="translate(554 625)">
    <rect class="card" width="385" height="235" rx="16"/>
    <rect class="cardHead" width="385" height="68" rx="16"/>
    <circle class="numCircle" cx="44" cy="34" r="25"/>
    <text class="num" x="44" y="34" text-anchor="middle">5</text>
    <text class="cardTitle" x="88" y="43">LP・商品ページ</text>
    <line class="rule" x1="48" y1="105" x2="337" y2="105"/>
    <text class="label" x="58" y="145">伝える順番を整理</text>
    <text class="sub" x="58" y="180">導入、魅力、具体的な内容、</text>
    <text class="sub" x="58" y="207">相談までの流れをまとめます。</text>
  </g>

  <g transform="translate(1003 625)">
    <rect class="card" width="385" height="235" rx="16"/>
    <rect class="cardHead" width="385" height="68" rx="16"/>
    <circle class="numCircle" cx="44" cy="34" r="25"/>
    <text class="num" x="44" y="34" text-anchor="middle">6</text>
    <text class="cardTitle" x="88" y="43">次にやること</text>
    <line class="rule" x1="48" y1="105" x2="337" y2="105"/>
    <text class="label" x="58" y="145">次の行動を明確に</text>
    <text class="sub" x="58" y="180">今すぐ整えること、</text>
    <text class="sub" x="58" y="207">次に作るものを整理します。</text>
  </g>

  <text class="footer" x="746.5" y="940" text-anchor="middle">納品形式：PDF / 6ページ</text>
</svg>
