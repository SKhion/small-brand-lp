<svg xmlns="http://www.w3.org/2000/svg" width="1493" height="1053" viewBox="0 0 1493 1053" role="img" aria-labelledby="title desc">
  <title id="title">納品物イメージ ブランド整理PDF</title>
  <desc id="desc">ブランド整理PDF全6枚の納品イメージ。現状整理、届ける相手、魅力と言葉、Instagram、LP・商品ページ、次にやることを整理します。</desc>
  <defs>
    <style>
      .bg{fill:#fff}.frame{fill:none;stroke:#d8d8d8;stroke-width:2}.title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:86px;font-weight:700;letter-spacing:.18em;fill:#121212}.subtitle{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:42px;font-weight:700;letter-spacing:.12em;fill:#a97a43}.lead{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:25px;font-weight:800;letter-spacing:.08em;fill:#111}.card{fill:#fffefa;stroke:#dfd3c6;stroke-width:1.5}.cardHead{fill:#f7efe6}.numCircle{fill:#c89b6c}.num{font-family:Georgia,serif;font-size:38px;font-weight:700;fill:#fff}.miniNum{font-family:Georgia,serif;font-size:18px;font-weight:700;fill:#fff}.cardTitle{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:26px;font-weight:900;letter-spacing:.03em;fill:#111}.body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:21px;font-weight:800;letter-spacing:.02em;fill:#111}.rule{stroke:#caa178;stroke-width:1.6}.icon{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.footer{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:27px;font-weight:800;letter-spacing:.04em;fill:#111}.doc{fill:none;stroke:#8c8c8c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect class="bg" width="1493" height="1053"/>
  <rect class="frame" x="1" y="1" width="1491" height="1051"/>

  <text class="title" x="746.5" y="118" text-anchor="middle">納品物イメージ</text>
  <text class="subtitle" x="746.5" y="190" text-anchor="middle">ブランド整理PDF（全6枚）</text>
  <line class="rule" x1="720" y1="225" x2="773" y2="225"/>
  <text class="lead" x="746.5" y="268" text-anchor="middle">売り出す前に、言葉・見せ方・見てもらう順番を整理します。</text>

  <g transform="translate(90 315)">
    <rect class="card" width="390" height="260" rx="16"/><rect class="cardHead" width="390" height="70" rx="16"/>
    <circle class="numCircle" cx="44" cy="35" r="25"/><text class="num" x="44" y="48" text-anchor="middle">1</text><text class="cardTitle" x="88" y="45">現状整理シート</text>
    <path class="icon" d="M62 103h40v44H62zM56 103h52M82 103v44M66 93c-11-18 15-21 16 0M99 93c11-18-15-21-16 0"/>
    <line class="rule" x1="48" y1="165" x2="340" y2="165"/>
    <text class="body" x="58" y="200">・商品・サービスの概要</text><text class="body" x="58" y="228">・今の悩み・迷い</text><text class="body" x="58" y="256">・ブランド名・印象</text>
  </g>

  <g transform="translate(552 315)">
    <rect class="card" width="390" height="260" rx="16"/><rect class="cardHead" width="390" height="70" rx="16"/>
    <circle class="numCircle" cx="44" cy="35" r="25"/><text class="num" x="44" y="48" text-anchor="middle">2</text><text class="cardTitle" x="88" y="45">届ける相手の整理</text>
    <circle class="icon" cx="81" cy="105" r="19"/><path class="icon" d="M48 156c5-27 22-42 52-42s47 15 52 42"/>
    <line class="rule" x1="58" y1="165" x2="332" y2="165"/>
    <text class="body" x="58" y="204">・届けたい相手</text><text class="body" x="58" y="236">・相手の悩み</text>
  </g>

  <g transform="translate(1014 315)">
    <rect class="card" width="390" height="260" rx="16"/><rect class="cardHead" width="390" height="70" rx="16"/>
    <circle class="numCircle" cx="44" cy="35" r="25"/><text class="num" x="44" y="48" text-anchor="middle">3</text><text class="cardTitle" x="88" y="45">魅力と言葉の整理</text>
    <path class="icon" d="M48 108l24-26h88l24 26-68 45zM48 108h136M72 82l44 71M160 82l-44 71"/>
    <line class="rule" x1="48" y1="165" x2="342" y2="165"/>
