  <g transform="translate(513 917)">
    <circle class="footerIcon" cx="30" cy="0" r="28"/>
    <path class="iconLine" d="M18-16h21l11 11v36H18zM39-16v13h11M25 6h18M25 17h18"/>
    <text class="footer" x="84" y="10">納品形式：PDF / 6ページ</text>
  </g>
</svg>